<!DOCTYPE html>
<html lang="en">
<head>
    <title>Napero</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="background.js" defer></script>
    <script src="content-loader.js" defer></script>
    <script src="router.js" defer></script>
</head>
<body>
    
    <nav class="fade-in">
        <ul>
            <li><a href="#" data-page="home"><i class="material-icons">home</i>Home</a></li>
            <li><a href="#about" data-page="about"><i class="material-icons">person</i>About</a></li>
            <li><a href="#projects" data-page="projects"><i class="material-icons">data_object</i>Projects</a></li>
            <li><a href="#blog" data-page="blog"><i class="material-icons">article</i>Blog</a></li>
            <li><a href="#contact" data-page="contact"><i class="material-icons">mail</i>Contact</a></li>
        </ul>
    </nav>

    <main id="page-content" class="fade-in">
        <!-- Content loaded dynamically by router.js -->
        <p class="loading">Loading...</p>
    </main>

    <!-- Nyan Cat Easter Egg (global) -->
    <div id="nyanCat" class="nyan-cat">
        <img src="https://media.tenor.com/k0EnzbhC4y0AAAAi/nyan-cat-nyan.gif" alt="Nyan Cat">
    </div>

    <!-- Image Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Enlarged image">
    </div>
</body>
</html>
